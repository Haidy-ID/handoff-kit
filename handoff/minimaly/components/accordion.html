<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accordion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 1">
    <span></span><span class="col">Accordion</span>
    <span class="row">closed</span>
    <div class="accordion" style="width: 480px">
      <details class="accordion__item"><summary>When is Compare available?<i class="icon" data-icon="caret-down"></i></summary><div class="accordion__body">With at least two selected projects.</div></details>
    </div>
    <span class="row">open</span>
    <div class="accordion" style="width: 480px">
      <details class="accordion__item" open><summary>Why is Load data disabled after I click it?<i class="icon" data-icon="caret-down"></i></summary><div class="accordion__body">It comes back only when the filter scope changes.</div></details>
    </div>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
