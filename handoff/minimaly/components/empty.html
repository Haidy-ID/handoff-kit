<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Empty state</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 2">
    <span></span><span class="col">Default</span><span class="col">Compact</span>
    <span class="row">Empty</span>
    <div class="empty"><div class="empty__art"><i class="icon" data-icon="tray"></i></div><h3 class="empty__title">No loans yet</h3><p class="empty__text">Lend something and it shows here, with who has it and when it comes back.</p><div class="empty__actions"><button class="btn" data-variant="primary"><i class="icon" data-icon="plus"></i>Add a loan</button></div></div>
    <div class="empty" data-variant="compact"><div class="empty__art"><i class="icon" data-icon="magnifying-glass"></i></div><h3 class="empty__title">No match</h3><p class="empty__text">Try another word.</p></div>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
