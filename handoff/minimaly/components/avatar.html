<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 3">
    <span></span><span class="col">Initials</span><span class="col">Photo</span><span class="col">Stack</span>
    <span class="row">default</span>
    <span class="avatar">JS</span><span class="avatar"><img src="avatar-sample.jpg" alt=""></span><span class="avatars"><span class="avatar">JS</span><span class="avatar">ML</span><span class="avatar">+3</span></span>
    <span class="row">lg</span>
    <span class="avatar" data-variant="lg">JS</span><span class="avatar" data-variant="lg"><img src="avatar-sample.jpg" alt=""></span><span class="avatars"><span class="avatar" data-variant="lg">JS</span><span class="avatar" data-variant="lg">ML</span><span class="avatar" data-variant="lg">+3</span></span>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
