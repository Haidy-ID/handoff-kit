<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sticky header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 2">
    <span></span><span class="col">At rest</span><span class="col">Stuck</span>
    <span class="row">Sticky header</span>
    <header class="sticky-header" style="position: relative; width: 360px"><button class="btn" data-variant="icon" aria-label="Back"><i class="icon" data-icon="arrow-left"></i></button><div class="sticky-header__titles"><h1 class="sticky-header__title">Quarterly report</h1><span class="sticky-header__subtitle">Edited 2 hours ago</span></div><button class="btn">Share</button></header>
    <header class="sticky-header" data-stuck style="position: relative; width: 360px"><button class="btn" data-variant="icon" aria-label="Back"><i class="icon" data-icon="arrow-left"></i></button><div class="sticky-header__titles"><h1 class="sticky-header__title">Quarterly report</h1><span class="sticky-header__subtitle">Edited 2 hours ago</span></div><button class="btn">Share</button></header>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
