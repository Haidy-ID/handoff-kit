<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hold to confirm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 2">
    <span></span><span class="col">Live: press and hold</span><span class="col">Confirmed</span>
    <span class="row">Hold to confirm</span>
    <button class="btn" data-hold data-confirmed="Deleted" id="hold"><i class="icon" data-icon="trash"></i>Hold to delete</button>
    <button class="btn" data-hold data-confirmed="Deleted" id="pinned"><i class="icon" data-icon="trash"></i>Hold to delete</button>
  </div>
  <script src="../ds.js"></script>
  <script>
    document.getElementById("pinned").dataset.state = "done";
    document.getElementById("hold").addEventListener("confirm", () => toast("Project deleted", { variant: "success" }));
  </script>
</body>
</html>
