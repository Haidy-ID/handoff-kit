<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Async button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 4">
    <span></span><span class="col">Idle</span><span class="col">Busy</span><span class="col">Done</span><span class="col">Error</span>
    <span class="row">Default</span>
    <button class="btn" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="idle"><i class="icon" data-icon="upload-simple"></i>Publish</button><button class="btn" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="busy"><i class="icon" data-icon="upload-simple"></i>Publish</button><button class="btn" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="done"><i class="icon" data-icon="upload-simple"></i>Publish</button><button class="btn" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="error"><i class="icon" data-icon="upload-simple"></i>Publish</button>
    <span class="row">Primary</span>
    <button class="btn" data-variant="primary" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="idle">Publish</button><button class="btn" data-variant="primary" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="busy">Publish</button><button class="btn" data-variant="primary" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="done">Publish</button><button class="btn" data-variant="primary" data-busy="Publishing" data-done="Published" data-error="Try again" data-pin="error">Publish</button>
    <span class="row">Copy</span>
    <button class="btn" data-copy="hello@example.com" data-pin="idle"><i class="icon" data-icon="copy"></i>Copy</button><span></span><button class="btn" data-copy="hello@example.com" data-pin="done"><i class="icon" data-icon="copy"></i>Copy</button><button class="btn" data-copy="hello@example.com" data-pin="error"><i class="icon" data-icon="copy"></i>Copy</button>
    <span class="row">Live: click them</span>
    <button class="btn" id="ok" data-busy="Publishing" data-done="Published" data-error="Try again"><i class="icon" data-icon="upload-simple"></i>Publish</button><button class="btn" id="ko" data-busy="Publishing" data-done="Published" data-error="Try again"><i class="icon" data-icon="upload-simple"></i>Publish (fails)</button><button class="btn" data-copy="hello@example.com"><i class="icon" data-icon="copy"></i>Copy</button><span></span>
  </div>
  <script src="../ds.js"></script>
  <script>
    // Specimen only: pin each state. Real pages never set data-state, runButton and data-copy do.
    document.querySelectorAll("[data-pin]").forEach((b) => { b.dataset.state = b.dataset.pin; });
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    document.getElementById("ok").onclick = (e) => runButton(e.currentTarget, () => wait(1200));
    document.getElementById("ko").onclick = (e) => runButton(e.currentTarget, () => wait(1200).then(() => { throw new Error("Server said no"); })).catch(() => {});
  </script>
</body>
</html>
