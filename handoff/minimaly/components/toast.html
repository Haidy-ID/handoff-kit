<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Toast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 1">
    <span></span><span class="col">Neutral · Success · With action · Critical (stays)</span>
    <span class="row">Live</span>
    <span style="display: flex; flex-wrap: wrap; gap: 8px"><button class="btn" id="t1">Neutral</button><button class="btn" id="t2">Success</button><button class="btn" id="t3">With action</button><button class="btn" id="t4">Critical</button></span>
    <span class="row">Static</span>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; width: 640px">    <div class="toast"><span class="toast__text">Link copied</span><button class="btn" data-variant="icon" aria-label="Dismiss"><i class="icon" data-icon="x"></i></button></div><div class="toast" data-variant="success"><i class="icon" data-icon="check-circle"></i><span class="toast__text">Changes saved</span><button class="btn" data-variant="icon" aria-label="Dismiss"><i class="icon" data-icon="x"></i></button></div><div class="toast"><span class="toast__text">2 items archived</span><button class="btn">Undo</button><button class="btn" data-variant="icon" aria-label="Dismiss"><i class="icon" data-icon="x"></i></button></div><div class="toast" data-variant="critical"><i class="icon" data-icon="warning-circle"></i><span class="toast__text">Upload failed</span><button class="btn">Retry</button><button class="btn" data-variant="icon" aria-label="Dismiss"><i class="icon" data-icon="x"></i></button></div></div>
  </div>
  <script src="../ds.js"></script>
  <script>
    const on = (id, fn) => { document.getElementById(id).onclick = fn; };
    on("t1", () => toast("Link copied"));
    on("t2", () => toast("Changes saved", { variant: "success" }));
    on("t3", () => toast("2 items archived", { action: { label: "Undo", onClick: () => toast("Restored") } }));
    on("t4", () => toast("Upload failed", { variant: "critical", action: { label: "Retry" } }));
  </script>
</body>
</html>
