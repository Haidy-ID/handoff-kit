<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Citation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 2">
    <span></span><span class="col">Default</span><span class="col">Hover</span>
    <span class="row">Citation</span>
    <span><a class="cite" href="#" data-tip="Loan policy · handbook.atlas.app" aria-label="Source 1: Loan policy">1</a></span>
    <span><a class="cite" href="#" data-force="hover" aria-label="Source 2: Returns FAQ">2</a></span>
    <span class="row">In an answer</span>
    <p class="stream" style="width: 320px; grid-column: 1 / -1">A loan without a return date stays open until it is marked returned <a class="cite" href="#" data-tip="Loan policy · handbook.atlas.app" aria-label="Source 1: Loan policy">1</a>. Reminders start seven days after the loan <a class="cite" href="#" data-tip="Reminders · help.atlas.app" aria-label="Source 2: Reminders">2</a> <a class="cite" href="#" data-tip="Release notes 4.2 · atlas.app" aria-label="Source 3: Release notes 4.2">3</a>.</p>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
