<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Icon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 6">
    <span></span><span class="col">regular</span><span class="col">bold</span><span class="col">fill</span><span class="col">light</span><span class="col">thin</span><span class="col">duotone</span>
    <span class="row">16 px</span>
    <i class="icon" data-icon="bell"></i><i class="icon" data-icon-style="bold" data-icon="bell"></i><i class="icon" data-icon-style="fill" data-icon="bell"></i><i class="icon" data-icon-style="light" data-icon="bell"></i><i class="icon" data-icon-style="thin" data-icon="bell"></i><i class="icon" data-icon-style="duotone" data-icon="bell"></i>
    <span class="row">24 px</span>
    <i class="icon" style="--icon-size: 24px" data-icon="bell"></i><i class="icon" data-icon-style="bold" style="--icon-size: 24px" data-icon="bell"></i><i class="icon" data-icon-style="fill" style="--icon-size: 24px" data-icon="bell"></i><i class="icon" data-icon-style="light" style="--icon-size: 24px" data-icon="bell"></i><i class="icon" data-icon-style="thin" style="--icon-size: 24px" data-icon="bell"></i><i class="icon" data-icon-style="duotone" style="--icon-size: 24px" data-icon="bell"></i>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
