<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 2">
    <span></span><span class="col">16 / 10, with caption</span><span class="col">4 / 5</span>
    <span class="row">Media</span>
    <figure class="media" style="width: 340px"><div class="media__frame" aria-hidden="true"><i class="icon" data-icon="image" style="--icon-size: 32px"></i></div><figcaption class="media__caption">The sync screen: local notes wait in a calm grey, not in red.</figcaption></figure>
    <figure class="media" style="width: 200px; --ratio: 4 / 5"><div class="media__frame" aria-hidden="true"><i class="icon" data-icon="user" style="--icon-size: 32px"></i></div></figure>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
