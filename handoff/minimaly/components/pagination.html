<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pagination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 1">
    <span></span><span class="col">Live: the arrows never move</span>
    <span class="row">24 pages</span>
    <nav class="pagination" data-pages="24" data-page="1"></nav>
    <span class="row">5 pages</span>
    <nav class="pagination" data-pages="5" data-page="3"></nav>
    <span class="row">120 pages, page 60</span>
    <nav class="pagination" data-pages="120" data-page="60"></nav>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
