<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Value</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 3">
    <span></span><span class="col">Rising</span><span class="col">Falling</span><span class="col">Live</span>
    <span class="row">Value</span>
    <span class="value" id="up">1,284</span><span class="value" id="down">1,284</span><span>Requests/s <strong class="value" id="live" data-label="Requests per second">1,284</strong></span>
  </div>
  <script src="../ds.js"></script>
  <script>
    // Specimen only: the page just writes textContent, ds.js does the flash.
    const fmt = (n) => n.toLocaleString("en-US");
    let up = 1284, down = 1284, live = 1284;
    setInterval(() => {
      document.getElementById("up").textContent = fmt((up += 17));
      document.getElementById("down").textContent = fmt((down -= 17));
      document.getElementById("live").textContent = fmt((live += Math.round(Math.random() * 300 - 150)));
    }, 2000);
  </script>
</body>
</html>
