<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Streaming text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 1">
    <span></span><span class="col">Live: click the text to show it all</span>
    <span class="row">Stream</span>
    <p class="stream" id="answer" style="width: 420px; min-height: 80px"></p>
    <span><button class="btn" id="again"><i class="icon" data-icon="arrow-clockwise"></i>Stream again</button></span>
  </div>
  <script src="../ds.js"></script>
  <script>
    const text = "The draft covers the three goals of the quarter. Two sections still need an owner, and the budget table is waiting for the final numbers from finance.";
    const run = () => streamText(document.getElementById("answer"), text);
    run();
    document.getElementById("again").onclick = run;
  </script>
</body>
</html>
