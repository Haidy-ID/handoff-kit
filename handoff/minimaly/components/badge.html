<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Badge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 5">
    <span></span><span class="col">neutral</span><span class="col">critical</span><span class="col">warning</span><span class="col">success</span><span class="col">accent</span>
    <span class="row">Badge</span>
    <span class="badge">CLOSED</span><span class="badge" data-variant="critical">AOG</span><span class="badge" data-variant="warning">DEFERRED</span><span class="badge" data-variant="success">RELEASED</span><span class="badge" data-variant="accent">NEW</span>
    <span class="row">With icon</span>
    <span class="badge"><i class="icon" data-icon="minus-circle"></i>CLOSED</span><span class="badge" data-variant="critical"><i class="icon" data-icon="x-circle"></i>AOG</span><span class="badge" data-variant="warning"><i class="icon" data-icon="clock"></i>DEFERRED</span><span class="badge" data-variant="success"><i class="icon" data-icon="check-circle"></i>RELEASED</span><span class="badge" data-variant="accent"><i class="icon" data-icon="sparkle"></i>NEW</span>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
