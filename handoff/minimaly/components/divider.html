<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Divider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 1">
    <span></span><span class="col">Divider</span>
    <span class="row">default</span>
    <div class="divider" style="width: 420px"><span>NEW MESSAGES</span></div>
    <span class="row">quiet</span>
    <div class="divider" data-variant="quiet" style="width: 420px"><span>Yesterday</span></div>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
