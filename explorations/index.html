<!doctype html>
<!-- Topic list of a group: every topic of the topics.json next to this page, search and grouping.
     Title, intro and groupings come from handoff.config.json → groups. Same file in every group folder. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../handoff/handoff.css">
</head>
<body class="landing">
  <header class="topbar"><span class="topbar__start"><a class="brand" id="brand" href="../"></a><nav class="breadcrumb" aria-label="Breadcrumb"><span class="breadcrumb__sep">/</span><span aria-current="page" id="crumb"></span></nav></span><span class="topbar__end"><a class="btn" data-variant="ghost" href="../handoff/playground/" data-tip="Browse the components of the design systems: variants, states and usage"><i class="icon" data-icon="puzzle-piece"></i>Components</a></span></header>
  <main class="page">
    <h1 id="title"></h1>
    <p class="intent" id="intro"></p>
    <div class="controls">
      <label class="input search"><i class="icon" data-icon="magnifying-glass"></i><input type="search" id="q" placeholder="Search topics" aria-label="Search topics"></label>
      <label class="select"><span class="select__label">Group by</span><select id="group"></select><i class="icon select__icon" data-icon="caret-down"></i></label>
      <label class="select"><span class="select__label">Show</span><select id="show"><option value="all">All</option><option value="active">In progress</option><option value="shipped">Shipped</option></select><i class="icon select__icon" data-icon="caret-down"></i></label>
    </div>
    <div id="list"></div>
  </main>
  <script src="../handoff/list.js"></script>
  <script src="../handoff/minimaly/ds.js"></script>
</body>
</html>
